name: Build Android APK

on:
  push:
    branches:
      - claude/mes-etoiles-app-y17ifl
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable

      - name: Prepare .env
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_ANON_KEY }}" > .env
          else
            cp .env.example .env
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Mes Étoiles — build ${{ github.run_number }}"
          make_latest: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            APK Android généré automatiquement par GitHub Actions (le SDK Android
            n'est pas accessible depuis l'environnement Claude Code sandbox).

            ⚠️ Si les secrets `SUPABASE_URL` / `SUPABASE_ANON_KEY` ne sont pas
            configurés dans les secrets du dépôt, cet APK utilise des identifiants
            Supabase de test et ne pourra pas se connecter à une vraie base.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mes-etoiles-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
